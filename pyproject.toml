[project]
name = "legal-crawler"
version = "0.1.0"
description = "Asynchronous legal document crawler"
readme = "README.md"
requires-python = ">=3.13.14"
dependencies = ["aiohttp>=3.14.1", "beautifulsoup4>=4.15.0", "docx2txt>=0.9", "loguru>=0.7.3", "lxml>=6.1.1", "pydantic>=2.13.4", "pydantic-settings>=2.14.2", "tenacity>=9.1.4"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.15.20", "ty>=0.0.56"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_crawler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
